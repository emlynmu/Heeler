# Temporary #629 probe on the emlynmu fork only; never merged.
name: Keyboard probe 629

on:
  push:
    branches: [emlyn/629-kbd-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E '^--|iPhone 17 '
      - name: Run the keyboard test alone, then its suite
        run: |
          mkdir -p probe
          status=0
          for n in 1 2 3 4 5 6 7 8; do
            make -o generate test-app DERIVED=build/DerivedData-probe \
              TEST_SELECTOR='HeelerTests/AgentDirectInputTests/composerAndDirectInputTransferVisibleKeyboardWithoutReloading()' \
              > "probe/alone-$n.log" 2>&1 || status=1
            grep -E '\[KBD629|✘|✔ Test composerAndDirect' "probe/alone-$n.log" | cut -c1-400 || true
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kbd-probe-629
          path: probe
          retention-days: 7
